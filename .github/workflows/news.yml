name: Actualizar noticias
on:
  schedule:
    - cron: "0 11 * * *"   # todos los dias 8:00 hs Argentina
  workflow_dispatch:        # permite correrlo a mano
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_news.py
      - name: Guardar cambios
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add site/news.json
            git commit -m "Actualizar noticias"
            git push
          fi
